name: Validate website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: node scripts/verify-legacy-assets.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: website-preview-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: website-production-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-production-${{ github.sha }}
          path: dist
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: HealthTAGWebsite-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync website to S3
        run: >-
          aws s3 sync dist "s3://${{ vars.AWS_S3_BUCKET }}"
          --delete
          --only-show-errors
          --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate CloudFront
        run: |
          healthtag_invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$healthtag_invalidation_id"
          echo "CloudFront invalidation completed: $healthtag_invalidation_id"
