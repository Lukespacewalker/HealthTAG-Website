name: Validate website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: node scripts/verify-legacy-assets.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contact
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: website-preview-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=healthtag-website --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
